{% extends 'base.html' %}{% block content %}<section class="auth panel"><p class="eyebrow">BEM-VINDO DE VOLTA</p><h1>Entre no seu fluxo.</h1>{% if error %}<p class="error" role="alert">{{ error }}</p>{% endif %}<form method="post">{% csrf_token %}<label for="email">E-mail</label><input id="email" name="email" type="email" autocomplete="username" required maxlength="254"><label for="password">Senha</label><input id="password" name="password" type="password" autocomplete="current-password" required><label class="checkbox"><input name="remember" type="checkbox"> Manter conectado</label><button class="button">Entrar ↗</button></form><p><a href="{% url 'password_reset' %}">Esqueci minha senha</a></p><p class="muted">Ainda não tem conta? <a href="{% url 'register' %}">Começar grátis</a></p></section>{% endblock %}
